kind = "web"
previewPath = "/"
title = "Nivi Chat"
version = "1.0.0"
id = "artifacts/nivi-chat"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21645

[services.development]
run = "pnpm --filter @workspace/nivi-chat run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/nivi-chat", "run", "build" ]
serve = "static"
publicDir = "artifacts/nivi-chat/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21645"
BASE_PATH = "/"
